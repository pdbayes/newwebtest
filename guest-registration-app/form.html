<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Registration Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .conditional-field {
            transition: all 0.3s ease-in-out;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            margin-top: 0;
            margin-bottom: 0;
        }
        .conditional-field.active {
            max-height: 200px; 
            opacity: 1;
            margin-top: 1.5rem; 
            margin-bottom: 1.5rem; 
        }
        .form-section {
            transition: all 0.3s ease-in-out;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="container mx-auto p-4 sm:p-6 md:p-8 max-w-2xl">
        <div class="bg-white rounded-2xl shadow-lg p-6 sm:p-8">
            <h1 class="text-2xl sm:text-3xl font-bold text-center text-gray-900 mb-6">Guest Registration Form</h1>
            
            <div id="confirmation-message" class="hidden bg-green-100 border-l-4 border-green-500 text-green-700 p-4 mb-6 rounded-md">
                <p>Thank you! Your registration has been submitted.</p>
            </div>
            <div id="error-message" class="hidden bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-6 rounded-md">
                <p>An error occurred. Please try again.</p>
            </div>

            <form id="guest-form">
                <div class="border-b pb-6 mb-6">
                    <h2 class="text-xl font-semibold text-gray-800 mb-4">Main Guest</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="md:col-span-2">
                            <label for="main_name" class="block text-sm font-medium text-gray-700 mb-2">Name</label>
                            <input type="text" id="main_name" name="main_name" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                        </div>
                        <div>
                            <label for="arrival_date" class="block text-sm font-medium text-gray-700 mb-2">Date of Arrival</label>
                            <input type="date" id="arrival_date" name="arrival_date" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                        </div>
                        <div>
                            <label for="departure_date" class="block text-sm font-medium text-gray-700 mb-2">Date of Departure</label>
                            <input type="date" id="departure_date" name="departure_date" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                        </div>
                        <div class="md:col-span-2">
                            <label for="main_nationality" class="block text-sm font-medium text-gray-700 mb-2">Nationality</label>
                            <select id="main_nationality" name="main_nationality" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                                <option value="">-- Select Nationality --</option>
                                <option value="UK">UK</option>
                                <option value="USA">USA</option>
                                <option value="Canada">Canada</option>
                                <option value="Australia">Australia</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>
                    <div id="main-guest-conditional" class="conditional-field">
                         <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label for="main_passport" class="block text-sm font-medium text-gray-700 mb-2">Passport Number</label>
                                <input type="text" id="main_passport" name="main_passport" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                            </div>
                            <div class="md:col-span-2">
                                <label for="main_next_destination" class="block text-sm font-medium text-gray-700 mb-2">Next Destination Address</label>
                                <input type="text" id="main_next_destination" name="main_next_destination" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mb-6">
                    <label for="num_additional_guests" class="block text-sm font-medium text-gray-700 mb-2">Number of additional guests (aged 16 or over)</label>
                    <select id="num_additional_guests" name="num_additional_guests" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>
                </div>

                <div id="additional-guests-container" class="space-y-6"></div>

                <div class="mt-8 text-center">
                    <button type="submit" id="submit-button" class="bg-blue-600 text-white font-bold py-3 px-8 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-300 transition-all duration-300 transform hover:scale-105">
                        Submit Registration
                    </button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('guest-form');
            const arrivalDateInput = document.getElementById('arrival_date');
            const departureDateInput = document.getElementById('departure_date');
            const mainNationalitySelect = document.getElementById('main_nationality');
            const mainGuestConditional = document.getElementById('main-guest-conditional');
            const numAdditionalGuestsSelect = document.getElementById('num_additional_guests');
            const additionalGuestsContainer = document.getElementById('additional-guests-container');
            const submitButton = document.getElementById('submit-button');
            const confirmationMessage = document.getElementById('confirmation-message');
            const errorMessage = document.getElementById('error-message');

            const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec';
            
            form.addEventListener('submit', function(e) {
                e.preventDefault();

                const formData = {};
                new FormData(form).forEach((value, key) => {
                    formData[key] = value;
                });

                submitButton.disabled = true;
                submitButton.textContent = 'Submitting...';

                google.script.run
                    .withSuccessHandler(function() {
                        confirmationMessage.style.display = 'block';
                        errorMessage.style.display = 'none';
                        form.reset();
                        mainNationalitySelect.dispatchEvent(new Event('change'));
                        numAdditionalGuestsSelect.dispatchEvent(new Event('change'));
                        window.scrollTo(0, 0);
                        submitButton.disabled = false;
                        submitButton.textContent = 'Submit Registration';
                    })
                    .withFailureHandler(function() {
                        errorMessage.textContent = 'Submission failed. Please try again.';
                        errorMessage.style.display = 'block';
                        confirmationMessage.style.display = 'none';
                        window.scrollTo(0, 0);
                        submitButton.disabled = false;
                        submitButton.textContent = 'Submit Registration';
                    })
                    .submitToSheet(formData);
            });

            function setMinDates() {
                const today = new Date().toISOString().split('T')[0];
                arrivalDateInput.setAttribute('min', today);
                departureDateInput.setAttribute('min', today);
            }
            
            arrivalDateInput.addEventListener('change', function() {
                if (this.value) {
                    departureDateInput.setAttribute('min', this.value);
                    if (departureDateInput.value < this.value) {
                        departureDateInput.value = '';
                    }
                }
            });

            function toggleConditionalFields(selectElement, conditionalContainer) {
                const passportInput = conditionalContainer.querySelector('input[name*="passport"]');
                const destinationInput = conditionalContainer.querySelector('input[name*="next_destination"]');

                if (selectElement.value !== 'UK' && selectElement.value !== '') {
                    conditionalContainer.classList.add('active');
                    passportInput.required = true;
                    destinationInput.required = true;
                } else {
                    conditionalContainer.classList.remove('active');
                    passportInput.required = false;
                    destinationInput.required = false;
                    passportInput.value = '';
                    destinationInput.value = '';
                }
            }

            mainNationalitySelect.addEventListener('change', () => toggleConditionalFields(mainNationalitySelect, mainGuestConditional));

            numAdditionalGuestsSelect.addEventListener('change', function() {
                const count = parseInt(this.value, 10);
                additionalGuestsContainer.innerHTML = ''; 

                for (let i = 1; i <= count; i++) {
                    const sectionHTML = `
                        <div class="form-section border-t pt-6" data-guest-number="${i}">
                            <h3 class="text-lg font-semibold text-gray-800 mb-4">Additional Guest ${i}</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div class="md:col-span-2">
                                    <label for="guest_${i}_name" class="block text-sm font-medium text-gray-700 mb-2">Name</label>
                                    <input type="text" id="guest_${i}_name" name="guest_${i}_name" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                                </div>
                                <div class="md:col-span-2">
                                    <label for="guest_${i}_nationality" class="block text-sm font-medium text-gray-700 mb-2">Nationality</label>
                                    <select id="guest_${i}_nationality" name="guest_${i}_nationality" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition guest-nationality-select">
                                        <option value="">-- Select Nationality --</option>
                                        <option value="UK">UK</option>
                                        <option value="USA">USA</option>
                                        <option value="Canada">Canada</option>
                                        <option value="Australia">Australia</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>
                            </div>
                            <div class="conditional-field">
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div>
                                        <label for="guest_${i}_passport" class="block text-sm font-medium text-gray-700 mb-2">Passport Number</label>
                                        <input type="text" id="guest_${i}_passport" name="guest_${i}_passport" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                                    </div>
                                    <div class="md:col-span-2">
                                        <label for="guest_${i}_next_destination" class="block text-sm font-medium text-gray-700 mb-2">Next Destination Address</label>
                                        <input type="text" id="guest_${i}_next_destination" name="guest_${i}_next_destination" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    additionalGuestsContainer.insertAdjacentHTML('beforeend', sectionHTML);
                }
            });

            additionalGuestsContainer.addEventListener('change', function(e) {
                if (e.target && e.target.classList.contains('guest-nationality-select')) {
                    const guestSection = e.target.closest('.form-section');
                    const conditionalContainer = guestSection.querySelector('.conditional-field');
                    toggleConditionalFields(e.target, conditionalContainer);
                }
            });
            
            setMinDates();
        });
    </script>
</body>
</html>
